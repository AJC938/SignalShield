[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalshield"
version = "0.1.0"
description = "Reproducible BPSK communications simulator and interactive digital lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
app = ["streamlit>=1.66,<2"]

[project.scripts]
signalshield-m1 = "signalshield.experiments:main"
signalshield-m2 = "signalshield.waveform_experiments:main"
signalshield-m3 = "signalshield.m3_experiments:main"
signalshield-m4 = "signalshield.m4_experiments:main"
signalshield-m5 = "signalshield.experiment_runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

